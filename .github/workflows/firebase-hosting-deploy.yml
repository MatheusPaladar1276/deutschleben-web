# Deploy automático para o Firebase Hosting a cada push na branch principal.
# Confere as regras ativas antes de publicar webapp/ (sem alterar firebase.json).
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Node para publicação das regras
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ferramentas de publicação
        run: npm install --prefix "$RUNNER_TEMP/dl-firebase" firebase-tools@15.32.1 google-auth-library@11.1.0

      - name: Publicar e conferir regras antes do Hosting
        run: node tools/publicar-regras.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy no Firebase Hosting (canal live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ricardo-d6119
          channelId: live
