name: Verificar credencial Firebase - somente leitura

on:
  push:
    branches: [verificar-credencial-ci]
    paths:
      - .github/workflows/verificar-credencial-ci.yml
      - tools/verificar-credencial-ci.cjs

permissions:
  contents: read

jobs:
  conferir:
    if: github.repository == 'MatheusPaladar1276/deutschleben-web' && github.ref == 'refs/heads/verificar-credencial-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Autenticar e consultar somente metadados e regras
        run: node tools/verificar-credencial-ci.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
